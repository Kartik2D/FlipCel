<!--
  Entry Point - HTML Structure

  Defines five canvas elements stacked with z-index layering:
  - Chrome Canvas (z-index: 4): Selection chrome (outline, bbox, handles, vertex nodes, marquee). No blend mode, pointer-events: none.
  - UI Canvas (z-index: 3): Receives ALL input events; grid + brush ring under mix-blend-mode: difference.
  - Pixel Canvas (z-index: 2): Low-resolution pixel drawing (temporary, cleared after tracing)
  - Paper Canvas (z-index: 1): Final vector paths rendered with Paper.js
  - Stage Canvas (z-index: 0): World-space stage background rectangle (camera-aligned)

  All canvases are full viewport size, absolutely positioned and stacked.
  The pixel canvas uses CSS image-rendering: pixelated for crisp low-res display.
-->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Inkwell - Pixel to Vector Drawing</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script>
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
        </script>
        <style>
            :root {
                --inkwell-font: "Inter", system-ui, sans-serif;

                --inkwell-app-bg: #f3efe8;
                --inkwell-canvas-bg: #fffdf9;
                --inkwell-panel-surface: #fffdf9;
                --inkwell-panel-depth: #d8d0c7;
                --inkwell-panel-border: #5f584f;
                --inkwell-topbar-surface: #fffdf9;
                --inkwell-text-primary: #29241e;
                --inkwell-text-secondary: #5f584f;
                --inkwell-text-muted: #80786d;
                --inkwell-accent: #4d73d7;
                --inkwell-accent-hover: #3e61bf;
                --inkwell-accent-muted: rgba(77, 115, 215, 0.28);
                --inkwell-track-bg: #d6cec4;
                --inkwell-toggle-track: #d8d0c7;
                --inkwell-toggle-border: #b3a99d;
                --inkwell-toggle-thumb: #fffdf9;
                --inkwell-danger: #af5b5b;
                --inkwell-danger-hover: #924747;
                --inkwell-danger-contrast: #ffffff;
                --inkwell-shadow-panel: 0 16px 34px rgba(34, 24, 10, 0.18);
                --inkwell-shadow-soft: 0 6px 18px rgba(34, 24, 10, 0.14);
                --inkwell-panel-active-overlay: rgba(255, 255, 255, 0.22);
                --inkwell-panel-active-danger: rgba(255, 122, 122, 0.58);
                --inkwell-scrollbar-thumb: rgba(95, 88, 79, 0.36);
            }

            html[data-theme="dark"] {
                --inkwell-app-bg: #2a313b;
                --inkwell-canvas-bg: #1a1e25;
                --inkwell-panel-surface: #21262f;
                --inkwell-panel-depth: #434c5c;
                --inkwell-panel-border: #798498;
                --inkwell-topbar-surface: #21262f;
                --inkwell-text-primary: #f5f7fb;
                --inkwell-text-secondary: #d2d8e4;
                --inkwell-text-muted: #9ea8bc;
                --inkwell-accent: #7c9eff;
                --inkwell-accent-hover: #97b2ff;
                --inkwell-accent-muted: rgba(124, 158, 255, 0.35);
                --inkwell-track-bg: #4b5567;
                --inkwell-toggle-track: #3f4859;
                --inkwell-toggle-border: #697386;
                --inkwell-toggle-thumb: #f7f9ff;
                --inkwell-danger: #c66d6d;
                --inkwell-danger-hover: #df8080;
                --inkwell-danger-contrast: #ffffff;
                --inkwell-shadow-panel: 0 18px 42px rgba(0, 0, 0, 0.38);
                --inkwell-shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.32);
                --inkwell-panel-active-overlay: rgba(255, 255, 255, 0.15);
                --inkwell-panel-active-danger: rgba(255, 124, 124, 0.42);
                --inkwell-scrollbar-thumb: rgba(245, 247, 251, 0.32);
            }

            *,
            *::before,
            *::after {
                margin: 0;
                box-sizing: border-box;
            }

            * {
                scrollbar-width: thin;
                scrollbar-color: var(--inkwell-scrollbar-thumb) transparent;
            }

            *::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            *::-webkit-scrollbar-track {
                background: transparent;
            }

            *::-webkit-scrollbar-thumb {
                background-color: var(--inkwell-scrollbar-thumb);
                background-clip: content-box;
                border: 1px solid transparent;
                border-radius: 999px;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: var(--inkwell-app-bg);
                touch-action: none;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                font-family: var(--inkwell-font);
                color: var(--inkwell-text-primary);
                transition: background-color 180ms ease, color 180ms ease;
            }

            #canvas-container {
                position: relative;
                width: 100%;
                height: 100%;
                touch-action: none;
            }

            canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                touch-action: none;
            }

            #stage-canvas {
                z-index: 0;
            }

            #paper-canvas {
                z-index: 1;
                transition: background-color 180ms ease;
            }

            #pixel-canvas {
                z-index: 2;
                image-rendering: pixelated;
                image-rendering: crisp-edges;
            }

            #ui-canvas {
                z-index: 3;
                pointer-events: auto;
                mix-blend-mode: difference;
            }

            #chrome-canvas {
                z-index: 4;
                pointer-events: none;
            }

        </style>
    </head>
    <body>
        <div id="canvas-container">
            <canvas id="stage-canvas"></canvas>
            <canvas id="paper-canvas"></canvas>
            <canvas id="pixel-canvas"></canvas>
            <canvas id="ui-canvas"></canvas>
            <canvas id="chrome-canvas"></canvas>
        </div>
        <!-- Floating UI Panels (draggable + resizable, positions in %) -->
        <inkwell-color-panel id="color-panel" draggable resizable style="--panel-top: 2%; --panel-right: 1%; display: none;"></inkwell-color-panel>
        <inkwell-top-bar-panel id="top-bar-panel-left" side="left"></inkwell-top-bar-panel>
        <inkwell-top-bar-panel id="top-bar-info-left" side="left" variant="info"></inkwell-top-bar-panel>
        <inkwell-top-bar-panel id="top-bar-panel-right" side="right"></inkwell-top-bar-panel>
        <inkwell-top-bar-panel id="top-bar-info-right" side="right" variant="info"></inkwell-top-bar-panel>
        <inkwell-tools-panel id="tools-panel" draggable resizable style="--panel-top: 28%; --panel-right: 1%; display: none;"></inkwell-tools-panel>
        <inkwell-universal-panel id="universal-panel" draggable resizable style="--panel-top: 50%; --panel-left: 1%; display: none;"></inkwell-universal-panel>
        <inkwell-layers-panel id="layers-panel" draggable resizable style="--panel-bottom: 2%; --panel-left: 1%; display: none;"></inkwell-layers-panel>
        <inkwell-wheel-panel id="wheel-panel" draggable style="--panel-bottom: 2%; --panel-right: 1%; display: none;"></inkwell-wheel-panel>
        <inkwell-functions-panel id="functions-panel"></inkwell-functions-panel>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
