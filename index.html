<!--
  Entry Point - HTML Structure

  Defines five canvas elements stacked with z-index layering:
  - Chrome Canvas (z-index: 4): Selection chrome (outline, bbox, handles, vertex nodes, marquee). No blend mode, pointer-events: none.
  - UI Canvas (z-index: 3): Receives ALL input events; grid + brush ring with dual-tone strokes for visibility on any backdrop.
  - Pixel Canvas (z-index: 2): Low-resolution pixel drawing (temporary, cleared after tracing)
  - Paper Canvas (z-index: 1): Final vector paths rendered with Paper.js
  - Stage Canvas (z-index: 0): World-space stage background rectangle (camera-aligned)

  All canvases are full viewport size, absolutely positioned and stacked.
  The pixel canvas uses CSS image-rendering: pixelated for crisp low-res display.
-->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Inkwell - Pixel to Vector Drawing</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script>
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
        </script>
        <style>
            :root {
                --inkwell-font: "Inter", system-ui, sans-serif;
            }

            /* Light: neutral grey hierarchy — canvas is brightest, UI chrome is distinct, surround recedes. */
            :root,
            html[data-theme="light"] {
                --inkwell-app-bg: #9a9a9a;
                --inkwell-canvas-bg: #cfcfcf;
                --inkwell-panel-surface: #e6e6e6;
                --inkwell-panel-depth: #a3a3a3;
                --inkwell-panel-inset-bg: #d4d4d4;
                --inkwell-panel-border: #484848;
                --inkwell-topbar-surface: #e6e6e6;
                --inkwell-text-primary: #1a1a1a;
                --inkwell-text-secondary: #333333;
                --inkwell-text-muted: #555555;
                --inkwell-accent: #4d73d7;
                --inkwell-accent-hover: #3e61bf;
                --inkwell-accent-muted: rgba(77, 115, 215, 0.28);
                --inkwell-track-bg: #c8c8c8;
                --inkwell-toggle-track: #c8c8c8;
                --inkwell-toggle-border: #999999;
                --inkwell-toggle-thumb: #fafafa;
                --inkwell-danger: #af5b5b;
                --inkwell-danger-hover: #924747;
                --inkwell-danger-contrast: #ffffff;
                --inkwell-shadow-panel: 0 16px 34px rgba(0, 0, 0, 0.16);
                --inkwell-shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.12);
                --inkwell-dock-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
                --inkwell-panel-active-overlay: rgba(255, 255, 255, 0.22);
                --inkwell-panel-active-danger: rgba(255, 122, 122, 0.58);
                --inkwell-scrollbar-thumb: rgba(0, 0, 0, 0.34);
                --inkwell-playhead: #c9a227;
                --inkwell-timeline-cell-bg: color-mix(
                    in srgb,
                    var(--inkwell-panel-depth) 72%,
                    #000000
                );
                --inkwell-timeline-active-row-bg: color-mix(
                    in srgb,
                    var(--inkwell-accent) 42%,
                    var(--inkwell-panel-surface)
                );
                --inkwell-timeline-playhead-bg: color-mix(
                    in srgb,
                    var(--inkwell-playhead) 34%,
                    var(--inkwell-panel-surface)
                );
                --inkwell-timeline-active-playhead-bg: color-mix(
                    in srgb,
                    var(--inkwell-timeline-active-row-bg) 58%,
                    var(--inkwell-timeline-playhead-bg)
                );
                --inkwell-timeline-selection-bg: color-mix(
                    in srgb,
                    var(--inkwell-accent) 48%,
                    var(--inkwell-panel-surface)
                );
            }

            html[data-theme="dark"] {
                --inkwell-app-bg: #121212;
                --inkwell-canvas-bg: #1a1a1a;
                --inkwell-panel-surface: #383838;
                --inkwell-panel-depth: #070707;
                --inkwell-panel-inset-bg: #2a2a2a;
                --inkwell-panel-border: #8a8a8a;
                --inkwell-topbar-surface: #383838;
                --inkwell-text-primary: #f0f0f0;
                --inkwell-text-secondary: #c8c8c8;
                --inkwell-text-muted: #999999;
                --inkwell-accent: #7c9eff;
                --inkwell-accent-hover: #97b2ff;
                --inkwell-accent-muted: rgba(124, 158, 255, 0.35);
                --inkwell-track-bg: #3a3a3a;
                --inkwell-toggle-track: #333333;
                --inkwell-toggle-border: #5a5a5a;
                --inkwell-toggle-thumb: #f0f0f0;
                --inkwell-danger: #c66d6d;
                --inkwell-danger-hover: #df8080;
                --inkwell-danger-contrast: #ffffff;
                --inkwell-shadow-panel: 0 18px 42px rgba(0, 0, 0, 0.38);
                --inkwell-shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.32);
                --inkwell-dock-shadow: 0 4px 16px rgba(0, 0, 0, 0.32);
                --inkwell-panel-active-overlay: rgba(255, 255, 255, 0.15);
                --inkwell-panel-active-danger: rgba(255, 124, 124, 0.42);
                --inkwell-scrollbar-thumb: rgba(255, 255, 255, 0.28);
                --inkwell-playhead: #f2c14e;
                --inkwell-timeline-cell-bg: color-mix(
                    in srgb,
                    var(--inkwell-panel-surface) 38%,
                    var(--inkwell-panel-depth)
                );
                --inkwell-timeline-active-row-bg: color-mix(
                    in srgb,
                    var(--inkwell-accent) 42%,
                    var(--inkwell-panel-surface)
                );
                --inkwell-timeline-playhead-bg: color-mix(
                    in srgb,
                    var(--inkwell-playhead) 26%,
                    var(--inkwell-panel-surface)
                );
                --inkwell-timeline-active-playhead-bg: color-mix(
                    in srgb,
                    var(--inkwell-timeline-active-row-bg) 52%,
                    var(--inkwell-timeline-playhead-bg)
                );
                --inkwell-timeline-selection-bg: color-mix(
                    in srgb,
                    var(--inkwell-accent) 48%,
                    var(--inkwell-panel-surface)
                );
            }

            *,
            *::before,
            *::after {
                margin: 0;
                box-sizing: border-box;
            }

            /* Native scrollbars are hidden app-wide; scrolling surfaces use
               the custom <inkwell-scrollbar> component instead. */
            * {
                scrollbar-width: none;
            }

            *::-webkit-scrollbar {
                display: none;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
                background: var(--inkwell-app-bg);
                touch-action: none;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
                font-family: var(--inkwell-font);
                color: var(--inkwell-text-primary);
                transition: background-color 180ms ease, color 180ms ease;
            }

            #canvas-container {
                position: relative;
                width: 100%;
                height: 100%;
                touch-action: none;
                background: var(--inkwell-canvas-bg);
                transition: background-color 180ms ease;
            }

            canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                touch-action: none;
            }

            #stage-canvas {
                z-index: 0;
            }

            #paper-canvas {
                z-index: 1;
                transition: background-color 180ms ease;
            }

            #pixel-canvas {
                z-index: 2;
                image-rendering: pixelated;
                image-rendering: crisp-edges;
            }

            #ui-canvas {
                z-index: 3;
                pointer-events: auto;
            }

            #chrome-canvas {
                z-index: 4;
                pointer-events: none;
            }

        </style>
      <script type="module" crossorigin src="/inkwell/assets/index-DSAvYnQD.js"></script>
    </head>
    <body>
        <div id="canvas-container">
            <canvas id="stage-canvas"></canvas>
            <canvas id="paper-canvas"></canvas>
            <canvas id="pixel-canvas"></canvas>
            <canvas id="ui-canvas"></canvas>
            <canvas id="chrome-canvas"></canvas>
        </div>
        <!-- Floating UI Panels (draggable + resizable, positions in %) -->
        <inkwell-color-panel id="color-panel" draggable resizable style="--panel-top: 2%; --panel-right: 1%; display: none;"></inkwell-color-panel>
        <inkwell-top-bar-panel id="top-bar"></inkwell-top-bar-panel>
        <inkwell-shortcuts-panel id="shortcuts-panel"></inkwell-shortcuts-panel>
        <inkwell-tools-panel id="tools-panel" draggable resizable style="--panel-top: 28%; --panel-right: 1%; display: none;"></inkwell-tools-panel>
        <inkwell-universal-panel id="universal-panel" draggable resizable style="--panel-top: 50%; --panel-left: 1%; display: none;"></inkwell-universal-panel>
        <inkwell-view-panel id="view-panel" draggable resizable style="--panel-top: 12%; --panel-right: 1%; display: none;"></inkwell-view-panel>
        <inkwell-layers-panel id="layers-panel" draggable resizable style="--panel-bottom: 2%; --panel-left: 1%; display: none;"></inkwell-layers-panel>
        <inkwell-wheel-panel id="wheel-panel" draggable style="--panel-bottom: 2%; --panel-right: 1%; display: none;"></inkwell-wheel-panel>
        <inkwell-functions-panel id="functions-panel"></inkwell-functions-panel>

    </body>
</html>
